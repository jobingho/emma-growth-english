<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Emma 的成长口语 · 美国孩子场景对话</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#26313a; --ink2:#5f6b74; --ink3:#9aa4ac;
    --line:#e7e4dc; --brand:#e07a4f; --brand2:#f6e2d7; --blue:#4a7fa8; --blue2:#e7f0f6;
    --ok:#3a8f6a; --ok2:#e3f2ea; --warn:#c98a1e; --warn2:#fbf1dc; --bad:#c2503f; --bad2:#f9e6e2;
    --radius:16px; --shadow:0 2px 10px rgba(38,49,58,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 40px}
  .top{position:sticky;top:0;z-index:20;background:rgba(246,245,241,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
  .top .row{display:flex;align-items:center;gap:10px}
  .top h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  .top .sub{font-size:12px;color:var(--ink3);margin-top:2px}
  .btn{border:0;background:none;font:inherit;cursor:pointer;color:inherit}
  .icon-btn{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .wrap{padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  .hero{display:flex;gap:14px;align-items:center}
  .avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#f6d9c6,#e07a4f);
    display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
  .hero h2{font-size:19px;margin:0 0 3px}
  .hero p{margin:0;color:var(--ink2);font-size:13px}
  .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--brand2);color:#a44f2e;margin:2px 4px 0 0}
  .seg{display:flex;gap:8px;margin-bottom:16px}
  .seg .btn{flex:1;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:14px;font-weight:500;color:var(--ink2)}
  .seg .btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .sec-title{font-size:13px;color:var(--ink3);margin:18px 4px 10px;font-weight:600;letter-spacing:.5px}
  .stage{font-size:12px;color:var(--ink3);margin:16px 4px 8px}
  .scene-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);width:100%;text-align:left}
  .scene-item .ic{width:42px;height:42px;border-radius:12px;background:var(--blue2);display:flex;
    align-items:center;justify-content:center;font-size:22px;flex:none}
  .scene-item .meta{flex:1;min-width:0}
  .scene-item .meta b{font-size:15px;display:block}
  .scene-item .meta span{font-size:12px;color:var(--ink3)}
  .scene-item .go{font-size:13px;color:var(--brand);font-weight:600;flex:none}
  .scene-item.lock{opacity:.5}
  .scene-item.done .ic{background:var(--ok2)}
  .scene-item.done .go{color:var(--ok)}
  .banner{background:linear-gradient(135deg,#4a7fa8,#365f80);color:#fff;border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow)}
  .banner b{font-size:15px}
  .banner p{margin:4px 0 0;font-size:12px;opacity:.9}
  .banner .btn{margin-top:12px;background:#fff;color:#365f80;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px}
  .chat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .chat-head .npc-av{width:44px;height:44px;border-radius:50%;background:var(--brand2);display:flex;
    align-items:center;justify-content:center;font-size:24px;flex:none}
  .chat-head b{font-size:15px;display:block}
  .chat-head span{font-size:12px;color:var(--ink3)}
  .bubble{max-width:86%;padding:12px 14px;border-radius:16px;margin-bottom:12px;font-size:16px;line-height:1.5}
  .bubble.npc{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .bubble.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .bubble .emo{font-size:20px;margin-right:4px}
  .emo-hint{font-size:12.5px;color:var(--warn);background:var(--warn2);border-radius:10px;padding:7px 11px;margin:-4px 0 12px}
  .zh-toggle{font-size:12px;color:var(--ink3);margin-top:6px;cursor:pointer;text-decoration:underline dotted}
  .zh-text{font-size:13px;color:var(--ink2);margin-top:6px}
  .play-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);
    background:var(--blue2);border-radius:8px;padding:5px 10px;margin-bottom:8px}
  .say-area{position:sticky;bottom:0;background:rgba(246,245,241,.96);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);margin:0 -16px}
  .opts{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
  .opts .btn{flex:none;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--blue);
    color:var(--blue);font-size:13px;white-space:nowrap}
  .input-row{display:flex;gap:8px}
  .input-row input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:16px;color:var(--ink);outline:none}
  .input-row input:focus{border-color:var(--brand)}
  .input-row .send{background:var(--brand);color:#fff;border-radius:12px;padding:0 18px;font-weight:600;font-size:15px}
  .tip-mic{font-size:11.5px;color:var(--ink3);margin:8px 2px 0;text-align:center}
  .progress{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
  .rc-head{text-align:center;padding:6px 0 16px}
  .rc-head .big{font-size:40px}
  .rc-head h2{font-size:20px;margin:6px 0 2px}
  .rc-head p{color:var(--ink2);font-size:13px;margin:0}
  .rc-row{border-radius:14px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line);background:var(--card)}
  .rc-row.ok{background:var(--ok2);border-color:#cfe8da}
  .rc-row.near{background:var(--warn2);border-color:#f0dcb4}
  .rc-row.warn{background:var(--warn2);border-color:#f0dcb4}
  .rc-row.miss{background:var(--bad2);border-color:#f0cfc9}
  .rc-row.bad{background:var(--bad2);border-color:#f0cfc9}
  .rc-row .lv{font-size:12px;font-weight:700;letter-spacing:.5px}
  .rc-row.ok .lv{color:var(--ok)} .rc-row.near .lv{color:var(--warn)} .rc-row.warn .lv{color:var(--warn)}
  .rc-row.miss .lv{color:var(--bad)} .rc-row.bad .lv{color:var(--bad)}
  .rc-row .said{font-size:14px;margin:6px 0;color:var(--ink)}
  .rc-row .native{font-size:14px;color:var(--blue);font-weight:500}
  .rc-row .why{font-size:12.5px;color:var(--ink2);margin-top:6px}
  .rc-label{font-size:12px;color:var(--ink3)}
  .card-title{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:6px}
  .fillers span{display:inline-block;background:var(--blue2);color:#365f80;border-radius:8px;
    padding:4px 9px;font-size:13px;margin:0 6px 6px 0}
  .culture .k{font-size:13px;color:var(--ink2);margin:0;line-height:1.7}
  .big-btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--brand);color:#fff;
    border:0;font-size:16px;font-weight:600;margin-top:8px}
  .ghost-btn{display:block;width:100%;padding:12px;border-radius:14px;background:var(--card);color:var(--ink2);
    border:1px solid var(--line);font-size:14px;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(38,49,58,.92);
    color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88%;text-align:center}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px}
  .mini-note{font-size:12px;color:var(--ink3);text-align:center;margin-top:14px;line-height:1.6}
  .lock-note{font-size:12px;color:var(--ink3)}
  .mode-tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--blue2);color:var(--blue);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 人设 ============ */
const HERO = {
  name:'Emma', cn:'艾玛', ageStart:4,
  city:'纽约 · 皇后区', family:'爸爸是会计师，妈妈是社区医院护士，有一个哥哥，养一只金毛',
  emoji:'👧'
};

/* ============ 场景数据（全成长线 4–18 岁） ============
   每个 turn 结构：
   npc/npcAv/emotion/emoHint/text/zh/options/nativeLine/intents[]/fallback
   intent: {keys:[], reply:'', emotion:'', emoHint:'', zh:'', quality:'ok|near|miss|bad', hint:'', aff:0, flag:''}
   场景可选字段：rating=14|16（分级锁门槛）；其余阶段字段统一 stage/age
*/
/* 小学 7–10 岁（先做的 13 个） */
const PRIMARY = [
  {
    id:'school', age:7, stage:'小学 7–10', icon:'🎒', title:'第一天上学',
    desc:'Emma 第一天去新学校，要跟老师和同学自我介绍。',
    culture:{title:'美国小学的早晨', body:'美国孩子上学第一天，老师会让学生做自我介绍。同学之间打招呼很随意，一句 Hi / Hey 就行；对老师则要礼貌，用 Hello / Good morning。称呼老师用 Ms. + 姓（如 Ms. Lopez），不直呼其名。'},
    turns:[
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'😊', emoHint:'老师微笑着看你，语速放慢了。',
        text:'Good morning! What’s your name?', zh:'早上好！你叫什么名字？',
        options:['I’m Emma.','My name is Emma.','Emma.'],
        nativeLine:'I’m Emma. Nice to meet you.',
        intents:[
          {keys:['i’m emma','im emma','i am emma','my name is emma','emma','i’m','my name'],
           reply:'Nice to meet you, Emma! We’re so happy you’re here.', emotion:'😊', emoHint:'老师很不客气地欢迎你。',
           zh:'很高兴认识你，Emma！我们很高兴你在这里。', quality:'ok', hint:'自我介绍时说 I’m Emma 或 My name is Emma 都对；加一句 Nice to meet you 更有礼貌，母语孩子常这么说。', aff:1, flag:'met_teacher'},
          {keys:['hi','hello','hey','good morning'],
           reply:'Hi there! And what’s your name?', emotion:'🙂', emoHint:'老师等你补上名字。',
           zh:'嗨！那你叫什么名字？', quality:'near', hint:'只说 Hi 没回答名字。老师问 What’s your name 时，要接上 I’m + 名字。', aff:0}
        ],
        fallback:{text:'Take your time. You can say “I’m Emma.”', emotion:'🙂', emoHint:'老师耐心地给你提示。', zh:'慢慢来，你可以说"I’m Emma."', quality:'miss', hint:'老师问的是名字。用 I’m + 你的名字 来回答，例如 I’m Emma。', aff:0}
      },
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'🙂', emoHint:'老师在点名册上写字。',
        text:'How old are you, Emma?', zh:'Emma，你几岁啦？',
        options:['I’m seven.','Seven.','I’m 7 years old.'],
        nativeLine:'I’m seven.',
        intents:[
          {keys:['i’m seven','im seven','i am seven','seven','7','seven years old','7 years old'],
           reply:'Seven! You’re in the right class then.', emotion:'😊', emoHint:'老师点点头。',
           zh:'七岁！那你来对班级了。', quality:'ok', hint:'回答年龄直接说 I’m seven. 就行。I’m 7 years old 语法没错，但日常口语里略显啰嗦。', aff:1},
          {keys:['i’m fine','good','okay','ok','i don’t know','i dont know'],
           reply:'That’s okay — you can tell me later.', emotion:'🙂', emoHint:'老师温和地说。',
           zh:'没关系，你可以待会儿告诉我。', quality:'miss', hint:'How old are you 问的是年龄，不是"你好吗"。要说 I’m + 数字。', aff:0}
        ],
        fallback:{text:'You can say “I’m seven.”', emotion:'🙂', emoHint:'老师给了提示。', zh:'你可以说"I’m seven."', quality:'miss', hint:'问年龄用 I’m + 数字回答，例如 I’m seven.', aff:0}
      },
      {
        npc:'Billy', npcAv:'👦', emotion:'😄', emoHint:'同桌男孩凑过来，语气很随意。',
        text:'Hi! Do you want to sit with me?', zh:'嗨！你想和我坐一起吗？',
        options:['Sure!','Yes, please.','Yeah, okay.'],
        nativeLine:'Sure, thanks!',
        intents:[
          {keys:['sure','yes please','yeah','okay','ok','yes','of course','i do'],
           reply:'Cool! I’m Billy. Let’s be desk partners.', emotion:'😄', emoHint:'Billy 很高兴。',
           zh:'太好了！我是 Billy，我们做同桌吧。', quality:'ok', hint:'同学之间答应邀请，Sure! / Yeah! 很自然。加一句 thanks 更有礼貌。', aff:1, flag:'friend_billy'},
          {keys:['no','not really','i don’t want','i dont want','leave me alone'],
           reply:'Oh… okay. Maybe later!', emotion:'😕', emoHint:'Billy 有点失落。',
           zh:'哦……好吧，那也许下次吧。', quality:'near', hint:'拒绝同学可以委婉一点：No thanks, maybe later. 直接说 leave me alone 会伤人。', aff:-1}
        ],
        fallback:{text:'You can just say “Sure!”', emotion:'🙂', emoHint:'Billy 等你回答。', zh:'你可以直接说"Sure!"', quality:'miss', hint:'对方在邀请你。答应就说 Sure! / Yes, please.，拒绝就说 No, thanks.', aff:0}
      },
      {
        npc:'Ms. Lopez', npcAv:'👩‍🏫', emotion:'🙂', emoHint:'老师指向你的课桌。',
        text:'Do you need help finding your desk?', zh:'需要我帮你找到座位吗？',
        options:['Yes, please.','No, thank you.','I’m okay, thanks.'],
        nativeLine:'Yes, please. Thank you!',
        intents:[
          {keys:['yes please','yes','i do','please'],
           reply:'Of course! Follow me.', emotion:'😊', emoHint:'老师在前带路。',
           zh:'当然！跟我来。', quality:'ok', hint:'接受帮助说 Yes, please. 是地道又礼貌的说法，比单说 Yes 好。', aff:1},
          {keys:['no thank you','no thanks','i’m okay','im okay','i’m fine','im fine','no'],
           reply:'All right, it’s right over there.', emotion:'🙂', emoHint:'老师指了指方向。',
           zh:'好的，就在那边。', quality:'ok', hint:'婉拒帮助说 No, thank you. / I’m okay, thanks. 都很地道。', aff:0}
        ],
        fallback:{text:'Just say “Yes, please” or “No, thank you.”', emotion:'🙂', emoHint:'老师等着。', zh:'说"Yes, please"或"No, thank you"就行。', quality:'miss', hint:'这是需要帮助的询问。用 Yes, please. 或 No, thank you. 回答。', aff:0}
      }
    ]
  },
  {
    id:'play', age:8, stage:'小学 7–10', icon:'🧸', title:'和邻居小孩玩',
    desc:'放学后，邻居家的 Timmy 来找你玩，你们要商量玩什么。',
    culture:{title:'放学后的 playdate', body:'美国孩子放学后常约邻居或同学玩，叫 playdate。邀请时很直接：Wanna play?（Want to 的口语缩略）。表达想玩什么用 Let’s… 或 How about…。如果不想玩某个游戏，通常会说 I don’t feel like it，再补一个替代建议，而不是直接拒绝。'},
    turns:[
      {
        npc:'Timmy', npcAv:'👦', emotion:'😄', emoHint:'邻居男孩抱着玩具跑过来。',
        text:'Hey! Wanna play with me?', zh:'嘿！想和我一起玩吗？',
        options:['Sure!','Yeah, let’s play.','What do you want to play?'],
        nativeLine:'Sure! What do you want to play?',
        intents:[
          {keys:['sure','yeah','yes','okay','ok','i do','let’s','lets play'],
           reply:'Awesome! I got new toy cars.', emotion:'😄', emoHint:'Timmy 眼睛亮了。',
           zh:'太棒了！我有新的玩具车。', quality:'ok', hint:'答应邀请说 Sure! / Yeah! 很自然。反问一句 What do you want to play? 更像母语孩子。', aff:1, flag:'played_timmy'},
          {keys:['what do you want','how about','what should we'],
           reply:'Hmm, I don’t know. You pick!', emotion:'😄', emoHint:'Timmy 把选择权交给你。',
           zh:'嗯，我不知道，你选吧！', quality:'ok', hint:'反问对方想玩什么也是很好的承接，说明你在参与对话。', aff:1}
        ],
        fallback:{text:'Just say “Sure!” or ask “What do you want to play?”', emotion:'🙂', emoHint:'Timmy 等你回答。', zh:'说"Sure!"或问"What do you want to play?"', quality:'miss', hint:'邀请用 Sure! 答应，或反问 What do you want to play?', aff:0}
      },
      {
        npc:'Timmy', npcAv:'👦', emotion:'🙂', emoHint:'Timmy 想了想。',
        text:'What do you want to play?', zh:'你想玩什么？',
        options:['Let’s play tag.','How about hide and seek?','I don’t know.'],
        nativeLine:'Let’s play tag!',
        intents:[
          {keys:['let’s','lets','tag','hide and seek','how about','i want to play','we can play'],
           reply:'Tag! Okay, you’re it first!', emotion:'😄', emoHint:'Timmy 开始跑。',
           zh:'抓人游戏！好，你先当鬼！', quality:'ok', hint:'提议一起玩用 Let’s + 游戏名，或 How about + 游戏名？，都是地道说法。', aff:1},
          {keys:['i don’t know','i dont know','anything','up to you','whatever'],
           reply:'Then I pick. Let’s play cars.', emotion:'🙂', emoHint:'Timmy 自己拿了主意。',
           zh:'那我选，我们玩车吧。', quality:'near', hint:'I don’t know 可以用，但接着给个建议会更好，比如 I don’t know — how about tag?', aff:0}
        ],
        fallback:{text:'You can say “Let’s play tag.”', emotion:'🙂', emoHint:'Timmy 等你说。', zh:'你可以说"Let’s play tag."', quality:'miss', hint:'提议游戏用 Let’s + 游戏名，例如 Let’s play tag.', aff:0}
      },
      {
        npc:'Timmy', npcAv:'👦', emotion:'😕', emoHint:'Timmy 皱了皱眉，语气有点不高兴。',
        text:'I don’t want to play that. It’s boring.', zh:'我不想玩那个，太无聊了。',
        options:['Okay, what do you want to play?','Fine, I don’t care.','But it’s fun!'],
        nativeLine:'Okay, what do you want to play?',
        intents:[
          {keys:['okay what','ok what','what do you want','how about','we could','let’s play','lets play','fine'],
           reply:'Let’s play with my cars instead!', emotion:'😄', emoHint:'Timmy 又开心起来。',
           zh:'那我们改玩我的车吧！', quality:'ok', hint:'对方否定了提议时，接受并反问 What do you want to play? 是很成熟、地道的接法。', aff:1},
          {keys:['but it’s fun','but it is fun','no it’s not','boring'],
           reply:'Hmm, but I still don’t want to.', emotion:'😕', emoHint:'Timmy 别过脸去。',
           zh:'嗯，但我还是不想玩。', quality:'near', hint:'直接反驳 but it’s fun 会让气氛变僵。先接住对方，再提新方案更自然。', aff:-1}
        ],
        fallback:{text:'Try “Okay, what do you want to play?”', emotion:'🙂', emoHint:'Timmy 看着你。', zh:'试试"Okay, what do you want to play?"', quality:'miss', hint:'对方否定了游戏。先接受 Okay…，再问 What do you want to play?', aff:0}
      },
      {
        npc:'Timmy', npcAv:'👦', emotion:'😊', emoHint:'Timmy 从口袋掏出饼干。',
        text:'Want some of my snacks?', zh:'要吃点我的零食吗？',
        options:['Yes, please! Thanks.','Sure, thanks!','No, I’m good.'],
        nativeLine:'Yes, please! Thanks.',
        intents:[

/* 全成长线按年龄顺序合并（稳定排序，同年龄保持剧情顺序） */
const byAge=(a,b)=>a.age-b.age;

const STAGES = [
  {key:'preschool', stage:'学龄前 4–6', icon:'🧸', note:'简单短句 · 需求与情绪表达', list:PRESCHOOL.slice().sort(byAge)},
  {key:'primary', stage:'小学 7–10', icon:'🎒', note:'同学社交 · 课堂 · 家庭琐事', list:PRIMARY.slice().sort(byAge)},

  scenes:g.list.map(s=>({title:s.title,id:s.id,icon:s.icon,rating:s.rating||0}))}));

/* ============ 状态与存储 ============ */
const KEY='emma_oral_v1';
const DEF={done:[],affinity:{},flags:{},wrongbook:[],voiceOn:true,unlocked:['need','school'],ratingCap:0};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,r||{})}catch(e){return Object.assign({},DEF)}}
/* 迁移：旧存档补上各阶段首个场景的解锁，并规整分级设置 */
STAGES.forEach(g=>{const id=g.list[0].id;if(S.unlocked.indexOf(id)<0)S.unlocked.push(id)});
if([0,14,16].indexOf(S.ratingCap)<0)S.ratingCap=0;
save();
function allowed(s){return (s.rating||0)<=S.ratingCap}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function norm(s){return String(s||'').toLowerCase().replace(/[’']/g,'’').replace(/[^a-z0-9’\s]/g,' ').replace(/\s+/g,' ').trim()}
function score(text,intent){const s=norm(text);let sc=0;(intent.keys||[]).forEach(k=>{const kw=norm(k);if(!kw)return;
  if(kw.indexOf(' ')<0){const w=s.split(' ');if(w.indexOf(kw)>=0)sc+=2;else if(s.indexOf(kw)>=0)sc+=1;}
  else if(s.indexOf(kw)>=0)sc+=3;});return sc}
function match(text,turn){let best=null,bs=0;(turn.intents||[]).forEach(it=>{const sc=score(text,it);if(sc>bs){bs=sc;best=it}});
  return best?best:(turn.fallback||{reply:turn.fallback&&turn.fallback.text||'',quality:'miss',hint:'再想想怎么说。',aff:0})}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const QUALITY={ok:{cls:'ok',full:'✅ 地道',short:'✅'},near:{cls:'near',full:'⚠️ 语法对但不够地道',short:'⚠️'},
  miss:{cls:'miss',full:'❌ 理解偏差',short:'❌'},bad:{cls:'bad',full:'❌ 表达不恰当',short:'❌'}};
function qinfo(q){return QUALITY[q]||QUALITY.miss}

/* ============ TTS ============ */
let voices=[];
function loadVoices(){try{voices=window.speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){const en=voices.filter(v=>/^en/i.test(v.lang));
  return en.find(v=>/Samantha|Karen|Daniel|Google US English|Microsoft Aria|Microsoft Zira/i.test(v.name))||en[0]||null}
function speak(text){if(!S.voiceOn||!('speechSynthesis' in window))return;
  try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[’]/g,"'"));
    u.lang='en-US';u.rate=.92;u.pitch=1;const v=pickVoice();if(v)u.voice=v;window.speechSynthesis.speak(u)}catch(e){}}
function wakeVoice(){if(!('speechSynthesis' in window)){toast('这个浏览器不支持朗读');return}
  try{const u=new SpeechSynthesisUtterance('Hi');u.lang='en-US';u.volume=0.01;window.speechSynthesis.speak(u);
    S.voiceOn=true;save();toast('语音已开启 ✓');render()}catch(e){toast('语音开启失败')}}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');

function topBar(title,sub,back){return `<div class="top"><div class="row">

    ${view.name==='home'?`<button class="icon-btn btn" data-act="wake" title="开启语音">🔊</button>`:''}

function renderTimeline(){
  let h=topBar('成长时间线','4 → 18 岁 · 一个女孩的连贯故事',{act:'home'})+'<div class="wrap">';
  TIMELINE.forEach(g=>{
    h+=`<div class="stage">${g.icon} ${esc(g.stage)} · ${esc(g.note)}</div>`;
    g.scenes.forEach(sc=>{
      const s=SCENES.find(x=>x.id===sc.id);
      const done=sc.id&&S.done.indexOf(sc.id)>=0;
      const unlocked=sc.id&&S.unlocked.indexOf(sc.id)>=0;
      const ageLocked=!allowed(s||{rating:sc.rating});
      const label=ageLocked?`需开启 ${sc.rating}+ · 点此设置`:done?'已完成':unlocked?'待解锁':'按主线解锁';
      h+=`<button class="scene-item btn ${ageLocked?'lock':''} ${done?'done':''}" ${ageLocked?`data-act="settings"`:(!unlocked?'disabled':`data-act="open" data-id="${sc.id}"`)}>
        <div class="ic">${done?'✓':ageLocked?'🔒':'📖'}</div>
        <div class="meta"><b>${esc(sc.title)}</b><span>${label}</span></div>
        <div class="go">${ageLocked?'🔓':(!unlocked?'':done?'重玩 ›':'开始 ›')}</div></button>`;
    });
  });
  h+=`<p class="mini-note">共 ${SCENES.length} 个场景，按 4 → 18 岁排成连贯主线。带 14+/16+ 标记的场景默认锁定，可在首页「内容分级设置」里开启。</p></div>`;
  app.innerHTML=h;
}

}

function renderWrong(){
  let h=topBar('我的错题本','不地道的表达都收在这里',{act:'home'})+'<div class="wrap">';
  if(!S.wrongbook.length)h+=`<div class="empty">📭 还没有错题<br>去场景里练几句，踩过的坑会自动收进来</div>`;
  else{S.wrongbook.slice().reverse().forEach((w,i)=>{
    const qi=qinfo(w.quality);
    h+=`<div class="rc-row ${qi.cls}"><div class="lv">${qi.short} ${esc(w.scene)}</div>
      <div class="said">${esc(w.said)}</div><div class="native">→ ${esc(w.native)}</div>
      <div class="why">${esc(w.hint)}</div></div>`});
    h+=`<button class="ghost-btn btn" data-act="clear-wrong">清空错题本</button>`}
  h+='</div>';app.innerHTML=h;
}

/* ============ 交互 ============ */
function unlockAudio(){if(!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(' ');u.lang='en-US';u.volume=0.01;window.speechSynthesis.speak(u)}catch(e){}}
function startRun(sceneId){const s=SCENES.find(x=>x.id===sceneId)||SCENES[0];
  if(!allowed(s)){toast('这个场景需要开启 '+s.rating+'+ 分级');go({name:'settings'});return}
  unlockAudio();
  run={sceneId:s.id,i:0,pending:true,log:[{who:'npc',text:s.turns[0].text,emotion:s.turns[0].emotion,zh:s.turns[0].zh,emoHint:s.turns[0].emoHint}],
    reviews:[],zhOpen:{},reply:null};
  go({name:'chat'});setTimeout(()=>speak(s.turns[0].text),250)}

function submitAnswer(text){
  text=String(text||'').trim();if(!text){toast('先说一句英文吧～');return}
  const s=SCENES.find(x=>x.id===run.sceneId);const t=s.turns[run.i];
  const m=match(text,t);
  run.log.push({who:'me',text});
  run.reply={text:m.reply||t.fallback.text,emotion:m.emotion||t.fallback.emotion,
    zh:m.zh||t.fallback.zh,emoHint:m.emoHint||t.fallback.emoHint};
  run.reviews.push({said:text,native:t.nativeLine,quality:m.quality||'miss',hint:m.hint||'',scene:s.title});
  if((m.quality||'miss')!=='ok'){S.wrongbook.push({scene:s.title,said:text,native:t.nativeLine,quality:m.quality||'miss',hint:m.hint||''});
    if(S.wrongbook.length>60)S.wrongbook.shift()}
  const npcName=t.npc;S.affinity[npcName]=(S.affinity[npcName]||0)+(m.aff||0);
  if(m.flag)S.flags[m.flag]=true;
  save();
  run.log.push({who:'npc',text:run.reply.text,emotion:run.reply.emotion,zh:run.reply.zh,emoHint:run.reply.emoHint});
  run.pending=false;render();setTimeout(()=>speak(run.reply.text),200)}

function nextTurn(){const s=SCENES.find(x=>x.id===run.sceneId);
  run.i++;run.reply=null;
  if(run.i>=s.turns.length){go({name:'recap'});return}
  const t=s.turns[run.i];run.pending=true;
  run.log.push({who:'npc',text:t.text,emotion:t.emotion,zh:t.zh,emoHint:t.emoHint});
  render();setTimeout(()=>speak(t.text),200)}

function finishScene(){const s=SCENES.find(x=>x.id===run.sceneId);
  if(S.done.indexOf(s.id)<0)S.done.push(s.id);
  const idx=SCENES.findIndex(x=>x.id===s.id);
  if(idx<SCENES.length-1){const nx=SCENES[idx+1].id;if(S.unlocked.indexOf(nx)<0)S.unlocked.push(nx)}
  if(S.done.length===SCENES.length){toast('🎉 4–18 岁全成长线完成！')}
  save();go({name:'home'})}

function bind(){
  app.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click',e=>{
      const a=el.getAttribute('data-act');
      if(a==='wake'){wakeVoice();return}
      if(a==='continue'){startRun(nextScene().id);return}
      if(a==='mode-main'){view.mode='main';renderHome();bind();return}
      if(a==='mode-free'){go({name:'free'});return}
      if(a==='timeline'){go({name:'timeline'});return}
      if(a==='settings'){go({name:'settings'});return}
      if(a==='set-rating'){S.ratingCap=+el.getAttribute('data-v');save();render();toast('分级设置已更新');return}
      if(a==='home'){go({name:'home'});return}
      if(a==='wrong'){go({name:'wrong'});return}
      if(a==='clear-wrong'){if(confirm('确定清空错题本？')){S.wrongbook=[];save();renderWrong();bind()}return}
      if(a==='open'){const t=SCENES.find(x=>x.id===el.getAttribute('data-id'));
        if(t&&!allowed(t)){toast('这个场景需要开启 '+t.rating+'+ 分级');go({name:'settings'});return}
        go({name:'intro',id:el.getAttribute('data-id'),from:view.name});return}
      if(a==='start'){startRun(view.id);return}
      if(a==='quit'){if(confirm('退出这个场景？进度不会保存。'))go({name:view.mode==='free'?'free':'home'});return}
      if(a==='say'){const i=+el.getAttribute('data-i');const m=run.log[i];if(m&&m.text)speak(m.text);return}
      if(a==='zh'){const i=+el.getAttribute('data-i');run.zhOpen[i]=!run.zhOpen[i];render();return}
      if(a==='opt'){submitAnswer(el.getAttribute('data-v'));return}
      if(a==='send'){const inp=document.getElementById('sayInput');submitAnswer(inp?inp.value:'');return}
      if(a==='next'){nextTurn();return}
      if(a==='recap-done'){finishScene();return}
      if(a==='replay'){startRun(run.sceneId);return}
    });
  });
  const inp=document.getElementById('sayInput');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitAnswer(inp.value)}});
}

render();
</script>
